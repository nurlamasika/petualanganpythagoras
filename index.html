<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pythagoras Adventure</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'edu-blue': '#38bdf8', /* Sky blue */
                        'edu-yellow': '#fde047', /* Yellow */
                        'edu-purple': '#a855f7', /* Purple */
                        'edu-mint': '#6ee7b7', /* Mint green */
                        'edu-coral': '#fb7185', /* Coral */
                        'edu-dark': '#1e293b'
                    },
                    fontFamily: {
                        sans: ['"Nunito"', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'slide-up': 'slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both',
                        'pop-in': 'popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both',
                        'wiggle': 'wiggle 2s ease-in-out infinite',
                        'flow-dash': 'flowDash 1s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        wiggle: {
                            '0%, 100%': { transform: 'rotate(-3deg)' },
                            '50%': { transform: 'rotate(3deg)' },
                        },
                        flowDash: {
                            '0%': { backgroundPosition: '0 0' },
                            '100%': { backgroundPosition: '0 15px' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- html2pdf for Certificate -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            /* Langit Petualangan Ceria */
            background: linear-gradient(135deg, #bae6fd 0%, #fbcfe8 50%, #fef08a 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow-x: hidden;
            min-height: 100vh;
            margin: 0;
        }

        /* Lapis 1: Pola Matematika Bergerak (Tema Petualangan) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='20,80 80,80 20,20' fill='rgba(255,255,255,0.2)' stroke='rgba(255,255,255,0.5)' stroke-width='2'/%3E%3Cpath d='M140,40 h10 v-10 h10 v10 h10 v10 h-10 v10 h-10 v-10 h-10 z' fill='rgba(255,255,255,0.25)'/%3E%3Ccircle cx='150' cy='150' r='15' fill='none' stroke='rgba(255,255,255,0.4)' stroke-width='3'/%3E%3Cpolygon points='50,150 70,150 50,130' fill='rgba(56, 189, 248, 0.4)'/%3E%3C/svg%3E");
            background-size: 250px 250px;
            animation: scrollPattern 30s linear infinite;
            z-index: -2;
            pointer-events: none;
        }

        /* Lapis 2: Awan/Kabut Petualangan Mengambang */
        body::after {
            content: '';
            position: fixed;
            top: -50%; left: -50%; right: -50%; bottom: -50%;
            background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,0.5) 0%, transparent 15%),
                              radial-gradient(circle at 80% 60%, rgba(255,255,255,0.5) 0%, transparent 15%),
                              radial-gradient(circle at 40% 80%, rgba(255,255,255,0.4) 0%, transparent 15%);
            animation: floatClouds 25s ease-in-out infinite alternate;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes scrollPattern {
            0% { background-position: 0px 0px; }
            100% { background-position: 250px 250px; }
        }

        @keyframes floatClouds {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(3%, 4%) scale(1.1); }
            100% { transform: translate(-3%, -2%) scale(1); }
        }
        
        .btn-game {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 0 0 rgba(0,0,0,0.15), inset 0 2px 0 0 rgba(255,255,255,0.4);
            border: 3px solid rgba(255,255,255,0.8);
            border-radius: 9999px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .btn-game:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 14px 0 0 rgba(0,0,0,0.15), inset 0 2px 0 0 rgba(255,255,255,0.6);
        }
        .btn-game:active {
            transform: translateY(4px) scale(0.98);
            box-shadow: 0 4px 0 0 rgba(0,0,0,0.15), inset 0 2px 0 0 rgba(255,255,255,0.3);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255,255,255,1);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 30px rgba(255, 255, 255, 0.8);
            border-radius: 2.5rem;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 45px -10px rgba(0, 0, 0, 0.15), 0 0 40px rgba(56, 189, 248, 0.3);
        }

        .page-transition {
            animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #e0f2fe; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #0284c7; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef, useMemo } = React;

        // --- FIREBASE CONFIGURATION (Strict Rules Applied) ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'pythagoras-adventure-1';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            // Mock config for local testing if env vars missing. 
            // In a real environment, __firebase_config is injected.
            projectId: "demo-project"
        };
        
        let app, db, auth;
        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
        } catch (e) {
            console.error("Firebase init error (expected in some mock environments):", e);
        }

        // --- DATA BENGKEL SOAL ---
        const QUIZ_BANK = [
            { id: 1, q: "Siapakah tokoh penemu Teorema Pythagoras?", options: ["Archimedes", "Pythagoras", "Euclid", "Newton"], a: 1 },
            { id: 2, q: "Teorema Pythagoras hanya berlaku pada segitiga...", options: ["Sama sisi", "Sama kaki", "Siku-siku", "Sembarang"], a: 2 },
            { id: 3, q: "Sisi terpanjang pada segitiga siku-siku disebut...", options: ["Alas", "Tinggi", "Hipotenusa", "Diagonal"], a: 2 },
            { id: 4, q: "Rumus Teorema Pythagoras yang benar adalah...", options: ["a² = b² + c²", "c² = a² + b²", "b² = a² + c²", "c = a + b"], a: 1 },
            { id: 5, q: "Jika panjang alas 3 cm dan tinggi 4 cm, berapakah sisi miringnya?", options: ["5 cm", "6 cm", "7 cm", "8 cm"], a: 0 },
            { id: 6, q: "Manakah dari kelompok bilangan berikut yang merupakan Tripel Pythagoras?", options: ["3, 4, 6", "5, 12, 13", "6, 8, 11", "7, 8, 9"], a: 1 },
            { id: 7, q: "Sebuah segitiga siku-siku memiliki sisi miring 10 cm dan alas 6 cm. Berapa tingginya?", options: ["8 cm", "7 cm", "6 cm", "5 cm"], a: 0 },
            { id: 8, q: "Sebuah tangga panjangnya 5 meter disandarkan pada tembok. Jarak ujung bawah tangga ke tembok 3 meter. Berapa tinggi tembok yang dicapai tangga?", options: ["2 m", "3 m", "4 m", "5 m"], a: 2 },
            { id: 9, q: "Jika a=8 dan b=15, maka nilai c pada segitiga siku-siku adalah...", options: ["16", "17", "18", "19"], a: 1 },
            { id: 10, q: "Nilai kuadrat dari 12 adalah...", options: ["124", "144", "169", "100"], a: 1 },
            { id: 11, q: "Akar kuadrat dari 225 adalah...", options: ["15", "25", "35", "5"], a: 0 },
            { id: 12, q: "Berapa panjang diagonal persegi yang panjang sisinya 5 cm?", options: ["5√2 cm", "10 cm", "25 cm", "5 cm"], a: 0 },
            { id: 13, q: "Diketahui segitiga siku-siku dengan sisi 9, 12, dan x. Jika x sisi miring, nilai x adalah?", options: ["14", "15", "16", "17"], a: 1 },
            { id: 14, q: "Sebuah kapal berlayar ke utara sejauh 8 km, lalu ke timur sejauh 6 km. Jarak kapal dari titik awal adalah...", options: ["10 km", "12 km", "14 km", "100 km"], a: 0 },
            { id: 15, q: "Manakah yang bukan Tripel Pythagoras?", options: ["7, 24, 25", "8, 15, 17", "9, 40, 41", "10, 12, 14"], a: 3 },
            { id: 16, q: "Rumus untuk mencari tinggi (a) jika diketahui sisi miring (c) dan alas (b) adalah...", options: ["a² = c² + b²", "a² = c² - b²", "a = c - b", "a² = b² - c²"], a: 1 },
            { id: 17, q: "Jika keliling segitiga siku-siku adalah 24 cm dan dua sisinya adalah 6 cm dan 8 cm, berapakah luasnya?", options: ["24 cm²", "48 cm²", "10 cm²", "14 cm²"], a: 0 }, // 6,8,10. L=1/2*6*8=24
            { id: 18, q: "TV memiliki layar berbentuk persegi panjang dengan diagonal 50 inci dan tinggi 30 inci. Berapa lebarnya?", options: ["20 inci", "40 inci", "60 inci", "80 inci"], a: 1 },
            { id: 19, q: "Tinggi sebuah tiang adalah 12 m. Seutas kawat ditarik dari puncak tiang ke tanah berjarak 5 m dari pangkal tiang. Panjang kawat adalah...", options: ["13 m", "15 m", "17 m", "14 m"], a: 0 },
            { id: 20, q: "Jika dua sisi segitiga siku-siku sama panjang yaitu 10 cm, maka sisi miringnya adalah...", options: ["10 cm", "20 cm", "10√2 cm", "100 cm"], a: 2 }
        ];

        // --- ICONS COMPONENT (Replacing Lucide if script fails, but assuming it works) ---
        const Icon = ({ name, size=24, color="currentColor", className="" }) => {
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });
            return <i data-lucide={name} width={size} height={size} stroke={color} className={className}></i>;
        };

        // --- MAIN APP COMPONENT ---
        const App = () => {
            // -- STATE --
            const [user, setUser] = useState(null); // Firebase Auth User
            const [studentData, setStudentData] = useState(null); // {name, class, absent, role}
            const [currentView, setCurrentView] = useState('home'); // home, login, teacherLogin, map, level1..6, quiz, reflection, cert, dashboard
            const [progress, setProgress] = useState({
                level1: false, level2: false, level3: false, level4: false, level5: false, level6: false,
                lkpd: null, quizScore: null, reflection: null
            });
            const [modal, setModal] = useState({ show: false, message: '', type: 'info', onConfirm: null });
            const [isTeacher, setIsTeacher] = useState(false);

            // -- INIT FIREBASE AUTH --
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (token) {
                            await signInWithCustomToken(auth, token);
                        } else {
                            await signInAnonymously(auth);
                        }
                        auth.onAuthStateChanged(async (u) => {
                            if (u) {
                                setUser(u);
                                // Try to fetch existing data
                                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', u.uid);
                                const docSnap = await getDoc(docRef);
                                if (docSnap.exists()) {
                                    const data = docSnap.data();
                                    setStudentData(data.profile);
                                    setProgress(data.progress || progress);
                                    if (data.profile.role === 'teacher') {
                                        setIsTeacher(true);
                                    }
                                }
                            }
                        });
                    } catch (error) {
                        console.error("Auth error:", error);
                        // Fallback for environment without Firebase configured
                        console.warn("Running in Offline/Local Mode");
                        const localData = localStorage.getItem('pythagoras_data');
                        if (localData) {
                            const parsed = JSON.parse(localData);
                            setStudentData(parsed.profile);
                            setProgress(parsed.progress);
                            setIsTeacher(parsed.profile?.role === 'teacher');
                            setUser({ uid: 'local-user-123' }); // Mock user
                        }
                    }
                };
                if(auth) initAuth();
            }, []);

            // -- DATA SAVING FUNCTION --
            const saveData = async (newProfile, newProgress) => {
                const updatedProfile = newProfile || studentData;
                const updatedProgress = newProgress || progress;
                
                setStudentData(updatedProfile);
                setProgress(updatedProgress);

                if (user && db) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', user.uid);
                        await setDoc(docRef, {
                            profile: updatedProfile,
                            progress: updatedProgress,
                            updatedAt: serverTimestamp()
                        }, { merge: true });
                    } catch (e) {
                        console.error("Error saving to Firebase:", e);
                    }
                } else {
                    // Local Storage Fallback
                    localStorage.setItem('pythagoras_data', JSON.stringify({
                        profile: updatedProfile,
                        progress: updatedProgress
                    }));
                }
            };

            const completeLevel = (levelKey) => {
                const newProgress = { ...progress, [levelKey]: true };
                saveData(null, newProgress);
                triggerConfetti();
                showAlert(`Bagus! Kamu telah menyelesaikan ${levelKey.toUpperCase()}!`, 'success');
                setTimeout(() => setCurrentView('map'), 2000);
            };

            // -- UTILS --
            const triggerConfetti = () => {
                if (window.confetti) {
                    window.confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#38bdf8', '#fde047', '#a855f7', '#6ee7b7', '#fb7185'] });
                }
            };

            const showAlert = (message, type = 'info', onConfirm = null) => {
                setModal({ show: true, message, type, onConfirm });
            };

            const closeAlert = () => {
                if (modal.onConfirm) modal.onConfirm();
                setModal({ show: false, message: '', type: 'info', onConfirm: null });
            };

            const handleLogout = () => {
                setStudentData(null);
                setIsTeacher(false);
                setCurrentView('home');
                localStorage.removeItem('pythagoras_data');
                // Don't sign out of Firebase auth to keep the session for the playground, just clear app state.
            }

            // -- SUB-COMPONENTS --

            const Mascot = ({ expression = 'happy', size = 'w-32 h-32', className="" }) => {
                // Enhanced cute SVG mascot
                return (
                    <div className={`relative ${size} animate-float mx-auto ${className}`}>
                        <svg viewBox="0 0 100 100" className="w-full h-full drop-shadow-2xl">
                            <defs>
                                <linearGradient id="mascotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stopColor="#fef08a" />
                                    <stop offset="100%" stopColor="#facc15" />
                                </linearGradient>
                            </defs>
                            {/* Triangle Body */}
                            <polygon points="10,90 90,90 10,10" fill="url(#mascotGrad)" stroke="#eab308" strokeWidth="4" strokeLinejoin="round"/>
                            
                            {/* Blush */}
                            <circle cx="28" cy="65" r="8" fill="#fb7185" opacity="0.7" filter="blur(1.5px)"/>
                            <circle cx="68" cy="65" r="8" fill="#fb7185" opacity="0.7" filter="blur(1.5px)"/>

                            {/* Eyes (Bigger, cuter) */}
                            <circle cx="35" cy="55" r="7" fill="#1e293b"/>
                            <circle cx="55" cy="55" r="7" fill="#1e293b"/>
                            
                            {/* Eye Highlights */}
                            <circle cx="33" cy="52" r="2.5" fill="white"/>
                            <circle cx="37" cy="56" r="1" fill="white"/>
                            <circle cx="53" cy="52" r="2.5" fill="white"/>
                            <circle cx="57" cy="56" r="1" fill="white"/>

                            {/* Smile (Thicker) */}
                            {expression === 'happy' && <path d="M 35 72 Q 45 85 55 72" fill="transparent" stroke="#1e293b" strokeWidth="5" strokeLinecap="round"/>}
                            {expression === 'thinking' && <circle cx="45" cy="75" r="4" fill="transparent" stroke="#1e293b" strokeWidth="3"/>}
                            
                            {/* Math symbols floating - playful */}
                            <text x="70" y="30" fontSize="18" fontWeight="black" fill="#a855f7" className="animate-wiggle" style={{transformOrigin: '70px 30px'}}>a²</text>
                            <text x="15" y="25" fontSize="16" fontWeight="black" fill="#38bdf8" className="animate-wiggle" style={{animationDelay: '0.5s', transformOrigin: '15px 25px'}}>+ b²</text>
                        </svg>
                    </div>
                );
            };

            // Komponen Animasi Latar Belakang Menari untuk Setiap Level
            const DancingShapes = () => (
                <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 flex items-center justify-center">
                    <div className="absolute top-[15%] left-[5%] text-sky-400 opacity-40 animate-bounce-slow text-6xl font-black drop-shadow-md">△</div>
                    <div className="absolute top-[25%] right-[10%] text-emerald-400 opacity-40 animate-pulse-fast text-6xl font-black drop-shadow-md">+</div>
                    <div className="absolute bottom-[20%] left-[15%] text-amber-400 opacity-40 animate-wiggle text-7xl font-black drop-shadow-md">○</div>
                    <div className="absolute bottom-[10%] right-[20%] text-purple-400 opacity-40 animate-float text-6xl font-black drop-shadow-md" style={{animationDelay: '1s'}}>a²</div>
                    <div className="absolute top-[45%] left-[80%] text-rose-400 opacity-40 animate-bounce-slow text-5xl font-black drop-shadow-md" style={{animationDelay: '0.5s'}}>&times;</div>
                    <div className="absolute top-[60%] left-[10%] text-blue-400 opacity-40 animate-float text-5xl font-black drop-shadow-md" style={{animationDelay: '1.5s'}}>c²</div>
                </div>
            );

            const Button = ({ onClick, children, variant = 'primary', className = '', icon = null }) => {
                const variants = {
                    primary: 'bg-gradient-to-r from-sky-400 to-blue-500 text-white',
                    secondary: 'bg-gradient-to-r from-purple-400 to-fuchsia-500 text-white',
                    accent: 'bg-gradient-to-r from-rose-400 to-pink-500 text-white',
                    success: 'bg-gradient-to-r from-emerald-400 to-teal-500 text-white',
                    warning: 'bg-gradient-to-r from-amber-400 to-orange-500 text-white'
                };
                return (
                    <button 
                        onClick={onClick}
                        className={`btn-game px-6 py-3 rounded-full font-bold text-lg flex items-center justify-center gap-2 ${variants[variant]} ${className}`}
                    >
                        {icon && <Icon name={icon} size={20} />}
                        {children}
                    </button>
                );
            };

            const TopNav = ({ title, showBack = true }) => (
                <div className="flex justify-between items-center p-4 rounded-b-3xl shadow-sm mb-6 sticky top-0 z-50 glass-card bg-white/40 border-b-2 border-white/60">
                    {showBack ? (
                        <button onClick={() => setCurrentView('map')} className="p-2 bg-white/50 backdrop-blur-sm rounded-full hover:bg-white/80 text-slate-700 transition">
                            <Icon name="arrow-left" />
                        </button>
                    ) : <div></div>}
                    <h1 className="text-xl font-black text-edu-dark text-center flex-1 drop-shadow-sm">{title}</h1>
                    <div className="flex gap-2">
                        {studentData && <div className="text-sm font-bold bg-white/60 backdrop-blur-sm text-sky-800 px-3 py-1 rounded-full shadow-inner">{studentData.name}</div>}
                    </div>
                </div>
            );

            // --- VIEWS ---

            const HomeView = () => (
                <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center relative overflow-hidden">
                    {/* Decorative Background Elements */}
                    <div className="absolute top-10 left-10 w-32 h-32 bg-pink-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-float"></div>
                    <div className="absolute bottom-20 right-20 w-40 h-40 bg-yellow-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-float" style={{animationDelay: '1s'}}></div>
                    <div className="absolute top-40 right-10 w-24 h-24 bg-blue-300 rounded-full mix-blend-multiply filter blur-2xl opacity-70 animate-float" style={{animationDelay: '2s'}}></div>

                    <div className="glass-card p-8 rounded-3xl max-w-lg w-full flex flex-col items-center relative z-10">
                        <Mascot size="w-48 h-48" className="animate-wiggle" />
                        <h1 className="text-5xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-edu-blue via-edu-purple to-edu-coral mt-6 mb-2 drop-shadow-sm leading-tight">
                            PYTHAGORAS<br/>
                            <span className="text-amber-500 drop-shadow-md" style={{WebkitTextStroke: '2px white', WebkitTextFillColor: '#f59e0b'}}>ADVENTURE</span>
                        </h1>
                        <p className="text-lg font-bold text-slate-600 mb-6 italic bg-white/50 px-4 py-2 rounded-full shadow-inner border border-white/60">"Jelajahi Segitiga, Taklukkan Tantangan!"</p>
                        
                        <div className="bg-amber-50 border-2 border-amber-200 p-4 rounded-xl mb-8 text-sm text-amber-800 font-bold w-full text-left shadow-sm">

                    if (score >= 90) predikat = "Sangat Hebat!";

                    const headers = ["Nama", "Kelas", "Absen", "Progres(%)", "Nilai Kuis", "Status Lulus"];
                    const rows = students.map(s => {
                        const progKeys = Object.keys(s.progress || {}).filter(k => k.startsWith('level') && s.progress[k]);
                        const percent = Math.round((progKeys.length / 6) * 100);
                        const isDone = s.progress?.level6 && s.progress?.lkpd && s.progress?.reflection && s.progress?.quizScore !== null;
                        return [
                            `"${s.profile?.name}"`,
                            `"${s.profile?.class}"`,
                            `"${s.profile?.absent}"`,
                            percent,
                            s.progress?.quizScore || 0,
                            isDone ? "Lulus" : "Belum"
                        ].join(",");
                    });
                    
                    const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows].join("\n");
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", "Rekap_Nilai_Pythagoras.csv");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                };

                const finishedCount = students.filter(s => s.progress?.level6 && s.progress?.quizScore !== null).length;
                const avgScore = students.length ? Math.round(students.reduce((acc, s) => acc + (s.progress?.quizScore || 0), 0) / students.length) : 0;

                return (
                    <div className="bg-slate-50 min-h-screen font-sans">
                        <div className="bg-edu-dark text-white p-6 sticky top-0 z-50 flex justify-between items-center shadow-md">
                            <h1 className="text-2xl font-black flex items-center gap-2"><Icon name="monitor"/> Dashboard Guru</h1>
                            <button onClick={handleLogout} className="text-red-400 hover:text-red-300 font-bold flex items-center gap-2"><Icon name="log-out"/> Keluar</button>
                        </div>

                        <div className="p-6 max-w-6xl mx-auto space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-edu-blue">
                                    <p className="text-slate-500 font-bold text-sm">Total Siswa Terdaftar</p>
                                    <p className="text-3xl font-black text-slate-800">{students.length}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-emerald-500">
                                    <p className="text-slate-500 font-bold text-sm">Selesai Belajar</p>
                                    <p className="text-3xl font-black text-emerald-600">{finishedCount}</p>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border-l-4 border-edu-purple">
                                    <p className="text-slate-500 font-bold text-sm">Rata-rata Nilai Kuis</p>
                                    <p className="text-3xl font-black text-purple-600">{avgScore}</p>
                                </div>
                            </div>

                            <div className="bg-white rounded-2xl shadow-sm overflow-hidden">
                                <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="font-black text-slate-700 text-lg">Rekapitulasi Siswa</h2>
                                    <Button onClick={exportCSV} variant="success" icon="download" className="!py-2 !text-sm">Export CSV</Button>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-slate-100 text-slate-600 uppercase text-xs">
                                                <th className="p-4 font-black">Nama / Kelas</th>
                                                <th className="p-4 font-black">Progres</th>
                                                <th className="p-4 font-black">Nilai Kuis</th>
                                                <th className="p-4 font-black">Refleksi</th>
                                                <th className="p-4 font-black">Aksi</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {loading && <tr><td colSpan="5" className="p-8 text-center text-slate-500">Memuat data...</td></tr>}
                                            {!loading && students.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">Belum ada data siswa.</td></tr>}
                                            {students.map(s => {
                                                const progKeys = Object.keys(s.progress || {}).filter(k => k.startsWith('level') && s.progress[k]);
                                                const percent = Math.round((progKeys.length / 6) * 100);
                                                const isDone = s.progress?.level6 && s.progress?.lkpd && s.progress?.reflection && s.progress?.quizScore !== null;
                                                return (
                                                    <tr key={s.id} className="hover:bg-slate-50 transition-colors">
                                                        <td className="p-4">
                                                            <div className="font-bold text-slate-800">{s.profile?.name}</div>
                                                            <div className="text-sm text-slate-500">{s.profile?.class} - Absen: {s.profile?.absent}</div>
                                                        </td>
                                                        <td className="p-4">
                                                            <div className="flex items-center gap-2">
                                                                <div className="w-full bg-slate-200 rounded-full h-2 max-w-[100px]">
                                                                    <div className="bg-edu-blue h-2 rounded-full" style={{width: `${percent}%`}}></div>
                                                                </div>
                                                                <span className="text-xs font-bold text-slate-600">{percent}%</span>
                                                            </div>
                                                        </td>
                                                        <td className="p-4">
                                                            {s.progress?.quizScore !== undefined ? (
                                                                <span className={`font-black px-3 py-1 rounded-full text-xs ${s.progress.quizScore >= 70 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}`}>
                                                                    {s.progress.quizScore}
                                                                </span>
                                                            ) : <span className="text-slate-400 text-sm">-</span>}
                                                        </td>
                                                        <td className="p-4 text-2xl" title={s.progress?.reflection?.text}>
                                                            {s.progress?.reflection?.emoji || <span className="text-slate-400 text-sm">-</span>}
                                                        </td>
                                                        <td className="p-4">
                                                            {isDone ? <span className="text-emerald-500 flex items-center gap-1 text-sm font-bold"><Icon name="check-circle" size={16}/> Lulus</span> : <span className="text-slate-400 text-sm">Proses</span>}
                                                        </td>
                                                    </tr>
                                                )
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // Modal Component
            const ModalAlert = () => {
                if (!modal.show) return null;
                const colors = {
                    info: 'text-edu-blue',
                    success: 'text-emerald-500',
                    warning: 'text-amber-500'
                };
                const icons = {
                    info: 'info',
                    success: 'check-circle',
                    warning: 'alert-triangle'
                };
                return (
                    <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
                        <div className="bg-white rounded-3xl p-8 max-w-sm w-full text-center shadow-2xl animate-bounce-slow" style={{animationIterationCount: 1}}>
                            <Icon name={icons[modal.type]} size={48} className={`mx-auto mb-4 ${colors[modal.type]}`} />
                            <p className="text-lg font-bold text-slate-700 mb-6">{modal.message}</p>
                            <Button onClick={closeAlert} className="w-full" variant="primary">Oke!</Button>
                        </div>
                    </div>
                );
            };

            // MAIN RENDER ROUTING
            return (
                <div className="antialiased text-slate-800">
                    <div key={currentView} className="page-transition">
                        {currentView === 'home' && <HomeView />}
                        {currentView === 'login' && <LoginView />}
                        {currentView === 'teacherLogin' && <TeacherLoginView />}
                        {currentView === 'map' && <MapView />}
                        {currentView === 'level1' && <Level1 />}
                        {currentView === 'level2' && <Level2 />}
                        {currentView === 'level3' && <Level3 />}
                        {currentView === 'level4' && <Level4 />}
                        {currentView === 'level5' && <Level5 />}
                        {currentView === 'level6' && <Level6Hub />}
                        {currentView === 'lkpd' && <LKPDView />}
                        {currentView === 'quiz' && <QuizView />}
                        {currentView === 'reflection' && <ReflectionView />}
                        {currentView === 'certificate' && <CertificateView />}
                        {currentView === 'dashboard' && <DashboardView />}
                    </div>
                    <ModalAlert />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
